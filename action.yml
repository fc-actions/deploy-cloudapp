# action.yml
name: 'FireClover Cloud Application Deployment'
description: 'FireClover Cloud Application Deployment'
branding:
  icon: 'aperture'
  color: 'orange'

inputs:
  dns-zone:
    description: 'The existing DNS Zone to create new records in'
    required: true
  subdomain:
    description: 'The new subdomain to create in the DNS Zone for the deployment'
    required: true
  fireclover-subscription:
    description: 'The FireClover Subscription'
    required: true
  aws-account-id:
    description: 'The aws account registered at FireClover on your FireClover subscription'
  region:
    description: 'This will likely not work if changed, due to certificates of CloudFront needs us-east-1.'
    default: 'us-east-1'
  azure-tenant-id:  
    description: 'The azure tenant registered at FireClover on your FireClover subscription'
  azure-subscription-id:  
    description: 'The azure subscription registered at FireClover on your FireClover subscription'
  fireclover-architecture-template:
    description: 'The cloud deployment template to use for deployment'
  folder-redirects:
    description: 'Will redirect urls ending in a folder path to folder/index.html. Do not use for React SPAs.'
  web-path:
    description: 'The folder of the static web to deploy. Static web will be available at <domain>/*'
  api-path:
    description: 'The folder of the api to deploy. API will be available at <domain>/api/*'
  api-handler:
    description: 'The path and function inside of the api to run.'
    default: 'dist/index.handler'
  scan-cdk:
    description: 'Use the AWS Sustainability scanner for the resulting CDK'
  bootstrap:
    description: 'Run bootstrap for the account using CDK'
    default: false
  context-file:
    description: 'CDK context file cdk.context.json that defines all context attributes for CDK. Other named parameters or cdk-parameters override the attributes in context file.'
  cdk-parameters:
    description: 'CDK parameters in the format of "-c parameter=value" i.e. "-c api-handler=dist/index.handler -c folder-redirects=false"'
    
runs:
  using: composite
  steps:        
    - name: Get uuid for folder
      id: uuid
      run: | 
        echo "::set-output name=uuid::$(head /dev/random|sha1sum|cut -c 1-10)"

    - uses: actions/checkout@v4
      if: inputs.context-file
      with:
        sparse-checkout: |
          ${{ inputs.context-file }}
        sparse-checkout-cone-mode: false
        path: context-${{ steps.uuid.outputs.uuid }}
        
    - name: Checkout AWS CDK template
      if: inputs.aws-account-id
      id: cdk
      run: |
        git clone https://github.com/fireclover/deploy-template-aws-${{ inputs.fireclover-architecture-template || 'spa-static-site' }}.git fc-aws-cdk-${{ steps.uuid.outputs.uuid }}
        echo "folder=fc-aws-cdk-${{ steps.uuid.outputs.uuid }}" >> $GITHUB_OUTPUT
        export CDK_ARGS="--require-approval never -c domain=${{ inputs.dns-zone }} -c subdomain=${{ inputs.subdomain }} -c accountId=${{ inputs.aws-account-id }} -c region=${{ inputs.region || 'us-east-1' }} ${{ inputs.cdk-parameters }}"
        [ ! -z "${{ inputs.web-path }}" ] && export CDK_ARGS="${CDK_ARGS} -c webPath=\"${{ inputs.web-path || 'dist' }}\" -c folderRedirects=${{ inputs.folder-redirects || false }}"
        [ ! -z "${{ inputs.api-path }}" ] && export CDK_ARGS="${CDK_ARGS} -c apiPath=\"${{ inputs.api-path }}\" -c env='${{ inputs.api-envs }}' -c apiHandler=${{ inputs.api-handler }}"
        echo "cdk-args=${CDK_ARGS}" >> $GITHUB_OUTPUT
        
      shell: bash
        
    - name: Build CDK AWS template
      id: build-cdk
      if: inputs.aws-account-id
      run: |
        [ ! -z "${{ inputs.context-file }}" ] && cp "context-${{ steps.uuid.outputs.uuid }}/${{ inputs.context-file }}" ${{ steps.cdk.outputs.folder }}/cdk.context.json 
        cd ${{ steps.cdk.outputs.folder }}
        echo "Deploying using ${{ inputs.fireclover-architecture-template }} @ $(git rev-parse --short HEAD)"
        npm i
        npm run build
        # left for future use #cp ${GITHUB_ACTION_PATH}/.config-files ~/
      shell: bash
      
    - name: Bootstrap AWS
      if: inputs.bootstrap
      run: |
        cd ${{ steps.cdk.outputs.folder }}
        npm run cdk bootstrap -- aws://${{ inputs.aws-account-id }}/${{ inputs.region || 'us-east-1' }} ${{ steps.cdk.outputs.cdk-args }}
      shell: bash
      
    - name: Synth AWS
      id: synth-cdk
      if: ${{ inputs.aws-account-id && (inputs.scan-cdk || false) }}
      run: |
        cd ${{ steps.cdk.outputs.folder }}     
        npm run cdk synth -- ${{ steps.cdk.outputs.cdk-args }}
      shell: bash

    # This never yields any results anyway
    #- name: AWS Sustainability Scanner
    #  if: ${{ steps.synth-cdk }}
    #  uses: aws-actions/sustainability-scanner@v1
    #  continue-on-error: true
    #  with:
    #    file: '${{ steps.uuid.outputs.folder }}/cdk.out/*template.json'

    - name: Deploy AWS
      if: inputs.aws-account-id
      run: |
        cd ${{ steps.cdk.outputs.folder }}      
        npm run cdk deploy -- ${{ steps.cdk.outputs.cdk-args }}        
      shell: bash
      
    - name: Cleanup AWS CDK
      if: inputs.aws-account-id
      run: |
        rm -rf ${{ steps.cdk.outputs.folder }}
      shell: bash
      
    - name: Checkout Azure Bicep template
      if: inputs.azure-tenant
      run: |
        git clone https://github.com/fireclover/deploy-template-azure-${{ inputs.fireclover-architecture-template }}.git fc-azure-bicep
      shell: bash
        
